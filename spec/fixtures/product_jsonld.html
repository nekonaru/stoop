<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Sepatu Lari ExampleShop</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Sepatu Lari ExampleShop",
    "offers": {
      "@type": "Offer",
      "price": "249000",
      "priceCurrency": "IDR",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>
</head>
<body>
  <h1>Sepatu Lari ExampleShop</h1>
  <p class="product-price">Rp 249.000</p>
</body>
</html>
