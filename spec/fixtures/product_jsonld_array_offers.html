<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Roti Cokelat ExampleShop</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Roti Cokelat ExampleShop",
    "image": "https://example-shop.com/img/roti.jpg",
    "offers": [{
      "@type": "Offer",
      "price": "12500",
      "priceCurrency": "IDR",
      "availability": "https://schema.org/InStock"
    }, {
      "@type": "Offer",
      "price": "13000",
      "priceCurrency": "IDR",
      "availability": "https://schema.org/OutOfStock"
    }]
  }
  </script>
</head>
<body>
  <h1>Roti Cokelat ExampleShop</h1>
</body>
</html>
